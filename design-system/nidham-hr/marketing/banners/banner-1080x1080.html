<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>Nidham HR — Instagram/Facebook Square 1080×1080</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; }
.banner {
  width: 1080px; height: 1080px; position: relative;
  font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  color: #0F172A; text-align: center;
  background:
    radial-gradient(760px 480px at 50% -14%, rgba(37,99,235,.15), transparent 64%),
    radial-gradient(640px 420px at 50% 116%, rgba(5,150,105,.11), transparent 64%),
    #F8FAFC;
  display: flex; flex-direction: column; align-items: center;
  padding: 72px 80px;
}
.logo { display: flex; align-items: center; gap: 14px; margin-bottom: 44px; }
.logo-mark {
  width: 56px; height: 56px; border-radius: 16px;
  background: linear-gradient(135deg, #2563EB, #1D4ED8);
  display: grid; place-items: center;
  color: #fff; font-family: 'Cairo'; font-weight: 900; font-size: 32px;
  box-shadow: 0 8px 20px rgba(37,99,235,.30);
}
.logo-name { font-family: 'Cairo'; font-weight: 800; font-size: 36px; }
.logo-name span { color: #2563EB; }
h1 {
  font-family: 'Cairo'; font-weight: 900; font-size: 66px;
  line-height: 1.3; letter-spacing: -.5px; margin-bottom: 18px;
}
h1 .hl { color: #2563EB; }
.sub { font-size: 26px; color: #475569; line-height: 1.7; margin-bottom: 40px; max-width: 26ch; }
.card {
  width: 560px; background: #fff; border: 1px solid #E4ECFC;
  border-radius: 22px; box-shadow: 0 20px 44px rgba(15,23,42,.13);
  padding: 28px; text-align: start; margin-bottom: 44px;
}
.card h3 { font-family: 'Cairo'; font-size: 22px; font-weight: 800; margin-bottom: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.stat { border: 1px solid #E4ECFC; border-radius: 15px; padding: 18px; }
.stat .num { font-family: 'Cairo'; font-size: 38px; font-weight: 800; line-height: 1.2; }
.stat .lbl { font-size: 15px; color: #475569; font-weight: 500; }
.stat.ok .num { color: #059669; }
.stat.warn .num { color: #B45309; }
.stat.bad .num { color: #DC2626; }
.chips { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 46px; }
.chip {
  display: inline-flex; align-items: center; gap: 9px;
  background: #fff; border: 1.5px solid #E4ECFC; border-radius: 9999px;
  padding: 12px 22px; font-size: 19px; font-weight: 600; color: #334155;
  box-shadow: 0 1px 3px rgba(15,23,42,.05);
}
.chip svg { width: 20px; height: 20px; color: #059669; }
.cta {
  display: inline-flex; align-items: center; gap: 14px;
  height: 76px; padding-inline: 44px; border-radius: 18px;
  background: #059669; color: #fff;
  font-size: 27px; font-weight: 700;
  box-shadow: 0 12px 28px rgba(5,150,105,.34);
}
.cta svg { width: 28px; height: 28px; }
.site { margin-top: 26px; font-size: 21px; font-weight: 600; color: #2563EB; letter-spacing: .3px; }
</style>
</head>
<body>
<div class="banner">
  <div class="logo">
    <div class="logo-mark">ن</div>
    <div class="logo-name">نِظام<span>.</span></div>
  </div>
  <h1>مرتبات شهر كامل<br>في <span class="hl">٤ دقائق</span></h1>
  <p class="sub">نظام إدارة الموارد البشرية اللي بيفهم الشركات المصرية</p>
  <div class="card">
    <h3>حضور اليوم</h3>
    <div class="stats">
      <div class="stat ok"><div class="num">142</div><div class="lbl">حاضر</div></div>
      <div class="stat warn"><div class="num">8</div><div class="lbl">متأخر</div></div>
      <div class="stat bad"><div class="num">5</div><div class="lbl">غائب</div></div>
    </div>
  </div>
  <div class="chips">
    <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>بصمة ZKTeco</div>
    <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>تأمينات تلقائية</div>
    <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>قانون العمل المصري</div>
  </div>
  <div class="cta">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    حمّل النسخة التجريبية مجاناً
  </div>
  <div class="site">nidhamhr.com</div>
</div>
</body>
</html>
